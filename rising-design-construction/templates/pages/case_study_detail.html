{% extends "base.html" %}
{% block content %}
<article class="mx-auto max-w-5xl px-4 py-12 sm:px-6 lg:px-8"><a href="{% url 'case_studies' %}" class="font-bold text-ink underline decoration-accent decoration-2 underline-offset-4">← All projects</a><p class="mt-8 text-sm font-bold uppercase tracking-wide text-orange-700">{{ study.service.title }} · {{ study.project_date|date:"F Y" }}</p><h1 class="mt-3 text-4xl font-black leading-tight text-ink sm:text-5xl">{{ study.title }}</h1><p class="mt-5 max-w-3xl text-xl leading-8 text-slate-600">{{ study.summary }}</p><img src="{{ study.cover_image.url }}" alt="{{ study.title }} project cover" class="mt-8 max-h-[38rem] w-full rounded-3xl object-cover"><div class="mt-10 max-w-3xl space-y-4 leading-8 text-slate-700">{{ study.body|linebreaks }}</div>{% if study.report_pdf %}<a class="mt-8 inline-flex rounded-full bg-ink px-5 py-3 font-bold text-white hover:bg-blue-950" href="{{ study.report_pdf.url }}" target="_blank" rel="noopener noreferrer">View project PDF</a>{% endif %}</article>
{% endblock %}
